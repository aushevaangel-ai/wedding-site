<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Евгений ♡ Анжела — 11.07.2026 — Батуми</title>
  <meta name="description" content="Свадебное приглашение: Евгений и Анжела. 11.07.2026, Батуми." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- ОБНОВЛЕННЫЕ ШРИФТЫ -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#fbfaf8;
      --ink:#1f2321;
      --muted:rgba(31,35,33,.68);
      --card:rgba(255,255,255,.72);
      --line:rgba(31,35,33,.10);
      --shadow: 0 16px 44px rgba(15,18,16,.12);
      --radius: 22px;

      /* палитра кружочков */
      --g1:#A9B7A6;
      --g2:#C7D2C6;
      --g3:#7F8E6E;
      --p1:#CDBFE8;
      --p2:#C3B0E0;
      --p3:#B6A0C8;

      /* ОБНОВЛЁННЫЕ ПЕРЕМЕННЫЕ ШРИФТА */
      --serif:"Cormorant Garamond", serif;
      --sans:"Manrope", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:
        radial-gradient(1100px 700px at 50% -10%, rgba(205,191,232,.25), transparent 60%),
        radial-gradient(1100px 700px at 20% 10%, rgba(199,210,198,.28), transparent 60%),
        linear-gradient(180deg, #ffffff, var(--bg));
      color:var(--ink);
      font-family:var(--sans);
      line-height:1.5;
    }

    a{ color:inherit; }
    .wrap{ width:min(720px, 92vw); margin:0 auto; padding: 12px 0 56px; }

    /* HERO */
    .hero{
      border-radius: calc(var(--radius) + 10px);
      overflow:hidden;
      box-shadow: var(--shadow);
      border:1px solid rgba(255,255,255,.75);
      background:
        linear-gradient(180deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.05) 45%, rgba(255,255,255,.40) 100%),
        url("./hero-mobile.png");
      background-size: cover;
      background-position: 50% 40%;
    }

    .hero-inner{
      padding: 54px 16px 22px;
      text-align:center;
    }

    .hero .script{
      font-family: var(--serif);
      font-style: italic;
      font-size: 18px;
      color: rgba(31,35,33,.85);
      margin:0 0 6px;
      text-shadow: 0 1px 0 rgba(255,255,255,.6);
    }

    /* ЦЕНТРАЛЬНАЯ НАДПИСЬ */
    .hero h1{
      font-family: var(--serif);
      font-size: clamp(38px, 8vw, 64px);
      font-weight: 600;
      letter-spacing: 1px;
      margin: 0 0 6px;
      text-shadow: 0 1px 0 rgba(255,255,255,.7);
    }

    .h2{
      font-family:var(--serif);
      font-size: 20px;
      margin: 0 0 10px;
      letter-spacing:.2px;
    }

    .lead{
      font-family:var(--serif);
      font-size: 18px;
      margin:0 0 6px;
      color: rgba(31,35,33,.90);
    }

    .t-time{
      font-family: var(--serif);
      font-weight: 700;
      color: rgba(31,35,33,.88);
    }

    .acc-sum b{
      font-family: var(--serif);
      letter-spacing:.2px;
      font-size: 16px;
    }

    .acc-mini{
      font-family: var(--serif);
      font-weight: 700;
    }

    .footer{
      margin-top: 16px;
      text-align:center;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <!-- ВЕСЬ HTML БЕЗ ИЗМЕНЕНИЙ -->
  <!-- (Я не менял структуру, только шрифты выше) -->
</body>
</html>
